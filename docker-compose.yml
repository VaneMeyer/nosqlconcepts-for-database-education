services:
  sqlzoo:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
      - postgres
    networks:
      - proxy_nw
      - default
    ports:
      - 80:80

  backend:
    build:
      context: "./backend"
    env_file: ".env"
    restart: "unless-stopped"
    depends_on:
      - "postgres"


  postgres:
    image: "postgres:latest"
    restart: "unless-stopped"
    env_file:
      - ".env"
    volumes:
      - ./db:/docker-entrypoint-initdb.d



networks:
  default:
    name: "sqlzoo_nw"
    driver: bridge
  proxy_nw:
    external: true
    name: "proxy_nw"

