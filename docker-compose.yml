services:
  frontend:
    build:
      context: "./frontend"
    depends_on:
      - "backend"
      - "postgres"
    ports:
      - "8080:3000"

  backend:
    build:
      context: "./backend"
    env_file: ".env"
    depends_on:
      - "postgres"
    ports:
      - "8000:8000"

  postgres:
    image: "postgres:latest"
    env_file: ".env"
    restart: "unless-stopped"
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
    driver: local


networks:
  default:
    name: "sqlzoo_nw"
  proxy_nw:
    external: true
    name: "proxy_nw"