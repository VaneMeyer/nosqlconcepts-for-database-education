#version: '3.8'
name: pdb-sqlzoo
services:
  pgtool:
    image: postgres:15
    container_name: pgtool
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    ports:
      - 5432
    volumes:
      - pgdatatool:/var/lib/postgresql/data
      - ./init/tool:/docker-entrypoint-initdb.d

  pgworld:
    image: postgres:15
    restart: always
    container_name: pgworld
    environment:
      POSTGRES_USER: ${PG_USER2}
      POSTGRES_PASSWORD: ${PG_PASSWORD2}
      POSTGRES_DB: ${PG_DATABASE2}
    ports:
      - 5432
    volumes:
#      - pgdata:/var/lib/postgresql/data
      - ./init/world:/docker-entrypoint-initdb.d
      
  pgmovie:
    image: postgres:15
    restart: always
    container_name: pgmovie
    environment:
      POSTGRES_USER: ${PG_USER3}
      POSTGRES_PASSWORD: ${PG_PASSWORD3}
      POSTGRES_DB: ${PG_DATABASE3}
    ports:
      - 5432
    volumes:
#      - pgdatamovie:/var/lib/postgresql/data
      - ./init/movie:/docker-entrypoint-initdb.d
        
  pgeuro:
    image: postgres:15
    restart: always
    container_name: pgeuro
    environment:
      POSTGRES_USER: ${PG_USER4}
      POSTGRES_PASSWORD: ${PG_PASSWORD4}
      POSTGRES_DB: ${PG_DATABASE4}
    ports:
      - 5432
    volumes:
#      - pgdataeuro:/var/lib/postgresql/data
      - ./init/euro:/docker-entrypoint-initdb.d
        
  pgteachers:
    image: postgres:15
    restart: always
    container_name: pgteachers
    environment:
      POSTGRES_USER: ${PG_USER5}
      POSTGRES_PASSWORD: ${PG_PASSWORD5}
      POSTGRES_DB: ${PG_DATABASE5}
    ports:
      - 5432
    volumes:
#      - pgdatateachers:/var/lib/postgresql/data
      - ./init/teachers:/docker-entrypoint-initdb.d
        
  pgbuses:
    image: postgres:15
    restart: always
    container_name: pgbuses
    environment:
      POSTGRES_USER: ${PG_USER6}
      POSTGRES_PASSWORD: ${PG_PASSWORD6}
      POSTGRES_DB: ${PG_DATABASE6}
    ports:
      - 5432
    volumes:
#      - pgdatabuses:/var/lib/postgresql/data
      - ./init/buses:/docker-entrypoint-initdb.d



  server:
    build: ./server
    container_name: server
    restart: always
    ports:
      - 5000
    depends_on:
      - pgtool
      - pgworld
      - pgeuro
      - pgmovie
      - pgteachers
      - pgbuses
    env_file:
      - .env

  client:
    build: ./client
    container_name: client
    restart: always
    ports:
      - 3000
    depends_on:
      - server
    stdin_open: true
    tty: true

volumes:
  pgdatatool:
#  pgdata:
#  pgdatamovie:
#  pgdataeuro:
#  pgdatateachers:
#  pgdatabuses:

